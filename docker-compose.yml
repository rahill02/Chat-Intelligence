version: '3.8'

services:
  chat-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat-intelligence:latest
    container_name: chat-intelligence-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - LLM_PROVIDER=mock
      # Uncomment to enable live Gemini or OpenAI:
      # - LLM_PROVIDER=gemini
      # - GEMINI_API_KEY=your_gemini_api_key_here
      # - OPENAI_API_KEY=your_openai_api_key_here
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s